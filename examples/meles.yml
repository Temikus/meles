# Lives in the control repo (<owner>/.github or <owner>/.meles). Paths are relative to it.
version: 1

defaults:
  mode: pr                 # observe | pr | enforce
  pr:
    branch: meles/housekeeping
    labels: [housekeeping]
    max_per_run: 20
    on_close: accept         # accept | reopen

selectors:
  all:    { archived: false, fork: false }
  public: { visibility: public }
  go:     { files: [go.mod] }
  python: { files: [pyproject.toml] }

policies:
  - id: deps.updater
    on: all
    with:
      prefer: renovate                      # renovate | dependabot
      extends: ["github>temikus/renovate-config"]
      forbid_both: true

  - id: security.features
    on: all
    mode: enforce
    with:
      secret_scanning: true
      push_protection: true
      dependabot_alerts: true
      private_vuln_reporting: true

  # Keys are GitHub's community standards. GitHub decides whether each is met,
  # including files inherited from the owner's public .github repo.
  - id: governance.standards
    on: public
    on_close: reopen                      # a security policy is not optional
    with:
      license:          { template: templates/LICENSE.apache-2.0 }
      security_policy:  { template: templates/SECURITY.md }
      codeowners:       { template: templates/CODEOWNERS, create_at: .github/CODEOWNERS }
      readme:           { badges: [ci, license] }       # check only

  # Keys are exact repo paths, for files GitHub does not track.
  # - id: governance.files
  #   on: all
  #   with:
  #     .editorconfig:  { template: templates/editorconfig }

  - id: governance.settings
    on: all
    mode: enforce
    with:
      merge: { squash: true, merge: false, rebase: false, delete_branch: true }
      features: { wiki: false, projects: false }
      ruleset: rulesets/default.json

  # `id` is the policy kind; a kind may repeat with disjoint selectors.
  - id: ci.shape
    on: go
    with: { shape: shapes/go.yml }

  - id: ci.shape
    on: python
    with: { shape: shapes/python.yml }

  - id: actions.pinning
    on: all
    on_close: reopen
    with: { pin: sha, comment_version: true }

  - id: release.tooling
    on: all
    with:
      tool: release-please
      config: templates/release-please.json
